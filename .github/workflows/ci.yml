name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install audited dependency set
      run: |
        python -m pip install --upgrade pip
        python -m pip install "pip-audit>=2.10.1,<3"
        python -m pip install ".[observability]"
    - name: Audit runtime and observability dependencies
      run: python -m pip_audit

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest mypy ruff
        pip install ".[observability]"
    - name: Lint with Ruff
      run: ruff check .
    - name: Type check with Mypy
      run: |
        # Cross-platform env vars
        python -m mypy --namespace-packages --explicit-package-bases src/
      env:
        MYPYPATH: src
    - name: Test with pytest
      run: pytest

