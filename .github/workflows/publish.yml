name: Publish to PyPI

# Builds and publishes atomicdjt-agent-session-bridge using PyPI Trusted
# Publishing (OIDC) -- no PyPI token is stored in this repository.
#
# One-time setup required on pypi.org before this workflow can publish
# (see README "Releasing" section):
#   1. Create a PyPI account if one does not exist.
#   2. On pypi.org, add a *pending* trusted publisher for a project named
#      atomicdjt-agent-session-bridge, with:
#        Owner:            atomicdjt
#        Repository name:  agent-session-bridge
#        Workflow name:    publish.yml
#        Environment name: pypi
#   3. Push a tag matching v*.*.* (e.g. v0.2.1), or run this workflow
#      manually from the Actions tab.
#
# Until that pending publisher exists, the "Publish" job below will fail
# authentication -- it makes no other change and stores no credentials.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip build twine
      - name: Verify release tag matches project version
        if: github.event_name == 'push'
        run: |
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          expected_tag="v${project_version}"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match project version $project_version (expected $expected_tag)."
            exit 1
          fi
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/atomicdjt-agent-session-bridge
    permissions:
      id-token: write  # required for OIDC trusted publishing; no API token needed
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
