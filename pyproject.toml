[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-session-bridge"
version = "0.1.0"
description = "Provider-neutral reference implementation for portable coding-agent session history."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Agent Session Bridge Contributors"}]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "mypy>=1.0.0",
    "ruff>=0.0.280"
]

[project.scripts]
agent-session = "cli.main:main"

